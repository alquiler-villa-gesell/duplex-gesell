<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Dúplex Gesell</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #ff385c; --text-dark: #222222; --border-color: #dddddd; --success: #12805c; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f8; color: var(--text-dark); padding: 24px; }
        .admin-container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .earnings-box { background: linear-gradient(135deg, #12805c 0%, #0b573e 100%); color: white; padding: 20px; border-radius: 16px; margin-bottom: 24px; }
        .grid-panel { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
        .card { background: white; border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; }
        .res-item { border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 12px; position: relative; background: #fafafa; }
        .btn-delete { position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: #c13515; font-size: 18px; cursor: pointer; font-weight: bold; }
        .badge-time { font-size: 11px; color: #666; background: #e0e0e0; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { font-size: 11px; font-weight: bold; display: block; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; }
        .btn-action { width: 100%; background: #222; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header">
        <h2>Panel de Control - Dúplex Gesell</h2>
    </div>

    <div class="earnings-box">
        <div style="font-size: 12px; text-transform: uppercase;">Total Acumulado en Reservas</div>
        <div style="font-size: 28px; font-weight: 800;" id="totalARS">$ 0</div>
        <div style="font-size: 14px; opacity: 0.9;" id="totalUSD">USD 0</div>
    </div>

    <div class="grid-panel">
        <!-- Lista de Reservas -->
        <div class="card">
            <h3>Reservas Registradas</h3>
            <div id="reservationsContainer" style="margin-top: 16px;">Cargando...</div>
        </div>

        <!-- Acciones: Cargar Fotos del Departamento -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="card">
                <h3>📷 Cargar Fotos del Dúplex</h3>
                <div class="input-group" style="margin-top: 12px;">
                    <label>Imagen Principal (URL)</label>
                    <input type="text" id="urlMain" placeholder="https://...">
                </div>
                <div class="input-group">
                    <label>Vista Secundaria 1 (URL)</label>
                    <input type="text" id="urlSub1" placeholder="https://...">
                </div>
                <div class="input-group">
                    <label>Vista Secundaria 2 (URL)</label>
                    <input type="text" id="urlSub2" placeholder="https://...">
                </div>
                <button class="btn-action" onclick="guardarFotos()">Actualizar Fotos en la Web</button>
            </div>
        </div>
    </div>
</div>

<script>
    // PEGA ACA EXACTAMENTE LAS MISMAS CLAVES QUE PUSISTE EN INDEX.HTML:
    const firebaseConfig = {
        apiKey: "AIzaSyBLHPsJQEkz4sCWPfcKXx6eMR-o9Au4vYY",
    authDomain: "duplex-gesell.firebaseapp.com",
    databaseURL: "https://duplex-gesell-default-rtdb.firebaseio.com",
    projectId: "duplex-gesell",
    storageBucket: "duplex-gesell.firebasestorage.app",
    messagingSenderId: "183025783048",
    appId: "1:183025783048:web:3007a01baf78a139ea9cbd",
    measurementId: "G-PC6HC3L3GJ"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function formatARS(val) { return '$ ' + Math.round(val).toLocaleString('es-AR'); }
    function formatUSD(val) { return 'USD ' + Math.round(val).toLocaleString('en-US'); }

    function borrarReserva(key) {
        if (confirm('¿Querés borrar esta reserva del sistema?')) {
            db.ref('reservas/' + key).remove();
        }
    }

    function guardarFotos() {
        const imgMain = document.getElementById('urlMain').value;
        const imgSub1 = document.getElementById('urlSub1').value;
        const imgSub2 = document.getElementById('urlSub2').value;

        db.ref('fotos').set({ imgMain, imgSub1, imgSub2 }, (err) => {
            if (!err) alert('¡Fotos actualizadas!');
        });
    }

    db.ref('reservas').on('value', snapshot => {
        const container = document.getElementById('reservationsContainer');
        container.innerHTML = '';
        let totalARS = 0, totalUSD = 0;

        if (!snapshot.exists()) {
            container.innerHTML = 'No hay reservas registradas.';
            document.getElementById('totalARS').innerText = '$ 0';
            document.getElementById('totalUSD').innerText = 'USD 0';
            return;
        }

        snapshot.forEach(child => {
            const key = child.key;
            const res = child.val();
            totalARS += res.baseTotalARS;
            totalUSD += res.baseTotalUSD;

            container.innerHTML += `
                <div class="res-item">
                    <button class="btn-delete" onclick="borrarReserva('${key}')">&times;</button>
                    <strong>${res.guestName}</strong>
                    <div style="font-size: 13px; color: #444; margin-top: 4px;">
                        📞 ${res.phone} | ✉️ ${res.email}<br>
                        📅 <strong>${res.checkin}</strong> al <strong>${res.checkout}</strong> (${res.nights} noches)
                    </div>
                    <div style="font-size: 15px; font-weight: bold; margin-top: 6px;">
                        ${formatARS(res.baseTotalARS)} (${formatUSD(res.baseTotalUSD)})
                    </div>
                    <span class="badge-time">Registrado el: ${res.createdTimestamp || 'N/A'}</span>
                </div>
            `;
        });

        document.getElementById('totalARS').innerText = formatARS(totalARS);
        document.getElementById('totalUSD').innerText = formatUSD(totalUSD);
    });
</script>
</body>
</html>
