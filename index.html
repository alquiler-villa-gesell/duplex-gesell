<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquiler Dúplex Villa Gesell - Disponibilidad y Reserva</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #ff385c; --primary-dark: #d70466; --text-dark: #222222; --text-gray: #717171; --border-color: #dddddd; --bg-light: #f7f7f7; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-light); color: var(--text-dark); padding: 20px; display: flex; justify-content: center; }
        .card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 20px; padding: 28px; max-width: 500px; width: 100%; box-shadow: 0 12px 32px rgba(0,0,0,0.1); }
        .gallery { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; border-radius: 12px; overflow: hidden; height: 220px; margin-bottom: 20px; }
        .gallery img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-side { display: grid; grid-template-rows: 1fr 1fr; gap: 8px; }
        .header h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .header p { color: var(--text-gray); font-size: 14px; margin-bottom: 18px; }
        .inputs-grid { border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
        .input-row { display: flex; border-bottom: 1px solid var(--border-color); }
        .input-group { flex: 1; padding: 10px 14px; display: flex; flex-direction: column; }
        .input-group:first-child { border-right: 1px solid var(--border-color); }
        .input-group label { font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .input-group input { border: none; outline: none; font-size: 14px; background: transparent; width: 100%; }
        .breakdown { border-top: 1px solid var(--border-color); padding-top: 16px; margin-top: 16px; }
        .line-item { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
        .total-item { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 12px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #e61e4f 0%, var(--primary-dark) 100%); color: white; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; }
        .error-msg { color: #c13515; font-size: 13px; font-weight: 600; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="gallery" id="galleryContainer">
        <img id="imgMain" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Playa">
        <div class="gallery-side">
            <img id="imgSub1" src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=400&q=80" alt="Dúplex">
            <img id="imgSub2" src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=400&q=80" alt="Interior">
        </div>
    </div>

    <div class="header">
        <h2>Dúplex en Villa Gesell</h2>
        <p>Avenida 1 y Paseo 140 • Consulta disponibilidad y reserva</p>
    </div>

    <form id="reservaForm" onsubmit="realizarReservaCliente(event)">
        <div class="inputs-grid">
            <div class="input-row">
                <div class="input-group">
                    <label for="checkin">Llegada</label>
                    <input type="date" id="checkin" min="2026-11-01" max="2027-03-31" value="2026-12-16" required onchange="calcularCotizacion()">
                </div>
                <div class="input-group">
                    <label for="checkout">Salida</label>
                    <input type="date" id="checkout" min="2026-11-01" max="2027-03-31" value="2026-12-30" required onchange="calcularCotizacion()">
                </div>
            </div>
            <div class="input-group">
                <label for="guestName">Nombre Completo *</label>
                <input type="text" id="guestName" placeholder="Ej: Juan Pérez" required>
            </div>
            <div class="input-group" style="border-top: 1px solid var(--border-color);">
                <label for="phone">Teléfono / WhatsApp *</label>
                <input type="tel" id="phone" placeholder="Ej: +54 9 11..." required>
            </div>
            <div class="input-group" style="border-top: 1px solid var(--border-color);">
                <label for="email">E-mail de Contacto *</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>
        </div>

        <div class="error-msg" id="errorMsg">⚠️ Las fechas seleccionadas ya están reservadas. Por favor elegí otro rango.</div>

        <div class="breakdown">
            <div class="line-item">
                <span id="rateLabel">Noches</span>
                <div>
                    <strong id="subtotalArs">$ 0</strong>
                    <span style="color: var(--text-gray); font-size: 12px;" id="subtotalUsd">(USD 0)</span>
                </div>
            </div>

            <div class="total-item">
                <span>Total Estimado</span>
                <div style="text-align: right;">
                    <span style="color: var(--primary);" id="totalArs">$ 0</span><br>
                    <span style="font-size: 13px; color: var(--text-gray);" id="totalUsd">(USD 0)</span>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">Solicitar y Confirmar Reserva</button>
    </form>
</div>

<script>
    // ACA PEGAS TUS CLAVES DE FIREBASE:
    const firebaseConfig = {
        apiKey: "AIzaSyBLHPsJQEkz4sCWPfcKXx6eMR-o9Au4vYY",
    authDomain: "duplex-gesell.firebaseapp.com",
    databaseURL: "https://duplex-gesell-default-rtdb.firebaseio.com",
    projectId: "duplex-gesell",
    storageBucket: "duplex-gesell.firebasestorage.app",
    messagingSenderId: "183025783048",
    appId: "1:183025783048:web:3007a01baf78a139ea9cbd",
    measurementId: "G-PC6HC3L3GJ"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const USD_RATE = 1512.76;
    let reservacionesExistentes = [];

    function getDailyPriceUSD(date) {
        const month = date.getMonth() + 1; const day = date.getDate();
        if (month === 11) return 50;
        if (month === 12) return day <= 15 ? 70 : 115;
        if (month === 1) return day <= 15 ? 125 : 135;
        if (month === 2) return day <= 14 ? 135 : 85;
        if (month === 3) return day <= 15 ? 65 : 50;
        return 50;
    }

    function formatARS(val) { return '$ ' + Math.round(val).toLocaleString('es-AR'); }
    function formatUSD(val) { return 'USD ' + Math.round(val).toLocaleString('en-US'); }

    let calculatedData = null;

    function haySolapamiento(checkin, checkout) {
        const reqIn = new Date(checkin + 'T00:00:00');
        const reqOut = new Date(checkout + 'T00:00:00');

        return reservacionesExistentes.some(res => {
            const exIn = new Date(res.checkin + 'T00:00:00');
            const exOut = new Date(res.checkout + 'T00:00:00');
            return (reqIn < exOut && reqOut > exIn);
        });
    }

    function calcularCotizacion() {
        const checkinInput = document.getElementById('checkin').value;
        const checkoutInput = document.getElementById('checkout').value;
        const errorMsg = document.getElementById('errorMsg');
        const btnSubmit = document.getElementById('btnSubmit');

        if (!checkinInput || !checkoutInput) return;

        if (haySolapamiento(checkinInput, checkoutInput)) {
            errorMsg.style.display = 'block';
            btnSubmit.disabled = true;
            btnSubmit.style.opacity = '0.5';
            return;
        } else {
            errorMsg.style.display = 'none';
            btnSubmit.disabled = false;
            btnSubmit.style.opacity = '1';
        }

        const checkin = new Date(checkinInput + 'T00:00:00');
        const checkout = new Date(checkoutInput + 'T00:00:00');
        if (checkout <= checkin) return;

        let nights = 0, subtotalUSD = 0, current = new Date(checkin);
        while (current < checkout) {
            subtotalUSD += getDailyPriceUSD(current);
            nights++;
            current.setDate(current.getDate() + 1);
        }

        let discountRate = nights >= 15 ? 0.15 : (nights >= 10 ? 0.10 : (nights >= 6 ? 0.05 : 0));
        const totalUSD = subtotalUSD - Math.round(subtotalUSD * discountRate);
        const totalARS = totalUSD * USD_RATE;

        document.getElementById('rateLabel').innerText = `${nights} noches`;
        document.getElementById('subtotalArs').innerText = formatARS(subtotalUSD * USD_RATE);
        document.getElementById('subtotalUsd').innerText = `(${formatUSD(subtotalUSD)})`;
        document.getElementById('totalArs').innerText = formatARS(totalARS);
        document.getElementById('totalUsd').innerText = `(${formatUSD(totalUSD)})`;

        calculatedData = { checkin: checkinInput, checkout: checkoutInput, nights, totalARS, totalUSD };
    }

    function realizarReservaCliente(e) {
        e.preventDefault();
        if (!calculatedData) return;

        const name = document.getElementById('guestName').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const now = new Date();
        const fechaHoraCreacion = now.toLocaleDateString('es-AR') + ' ' + now.toLocaleTimeString('es-AR');

        const newRes = {
            guestName: name,
            phone: phone,
            email: email,
            checkin: calculatedData.checkin,
            checkout: calculatedData.checkout,
            nights: calculatedData.nights,
            baseTotalARS: calculatedData.totalARS,
            baseTotalUSD: calculatedData.totalUSD,
            createdTimestamp: fechaHoraCreacion
        };

        db.ref('reservas').push(newRes, (err) => {
            if (!err) {
                alert('¡Reserva registrada con éxito!');
                location.reload();
            }
        });
    }

    db.ref('reservas').on('value', snapshot => {
        reservacionesExistentes = [];
        snapshot.forEach(child => { reservacionesExistentes.push(child.val()); });
        calcularCotizacion();
    });

    db.ref('fotos').on('value', snapshot => {
        const fotos = snapshot.val();
        if (fotos) {
            if (fotos.imgMain) document.getElementById('imgMain').src = fotos.imgMain;
            if (fotos.imgSub1) document.getElementById('imgSub1').src = fotos.imgSub1;
            if (fotos.imgSub2) document.getElementById('imgSub2').src = fotos.imgSub2;
        }
    });
</script>
</body>
</html>
